name: release

# Tag-triggered build + publish to PyPI via trusted publishing (OIDC).
# There is no API token and no .pypirc: icpp-pro is only ever published from
# this workflow, never from a laptop.
#
# Maintainer prerequisites (one-time):
# - PyPI project `icpp-pro` with a trusted publisher for this repo,
#   workflow `release.yml`, environment `pypi`.
# - GitHub environment `pypi` on this repo.
#
# icpp-candid must be published FIRST: icpp-pro pins `icpp-candid>=X.Y.Z` and
# the build job below refuses to continue until that exact version is on PyPI.
# See README-release-guide.md for the full ceremony.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The minimum supported Python (matches `requires-python = ">=3.11"`).
      # The wheel is py3-none-any; the full version matrix runs in cicd-*.yml.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The version is single-sourced from src/icpp/version.py; nothing in the
      # build reads the git tag. Without this assert, tagging v6.1.1 on a tree
      # that still says 6.1.0 would quietly publish 6.1.0 a second time.
      - name: assert the tag matches version.py
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import sys; sys.path.append('src/icpp'); import version; print(version.__version__)")
          echo "tag=$TAG  version.py=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag '$TAG' does not match src/icpp/version.py '$PKG'"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      # icpp-pro is useless to users until its icpp-candid dependency can
      # resolve. Fail here - loudly and before anything is published - rather
      # than shipping a release whose install breaks. PyPI's index can lag a
      # few seconds behind an upload, hence the retries.
      - name: verify icpp-candid ${{ steps.version.outputs.version }} is on PyPI
        run: |
          VER="${{ steps.version.outputs.version }}"
          for attempt in 1 2 3 4 5; do
            if pip download "icpp-candid==$VER" --no-deps -d /tmp/candid-check >/dev/null 2>&1; then
              echo "icpp-candid $VER is available on PyPI"
              exit 0
            fi
            echo "attempt $attempt: icpp-candid $VER not on PyPI yet, retrying in 20s"
            sleep 20
          done
          echo "::error::icpp-candid $VER is not on PyPI. Tag and release icpp-candid first, then re-run this workflow."
          exit 1

      - name: install build tooling
        run: python -m pip install --upgrade pip build

      - name: build sdist and wheel
        run: make pypi-build

      # Same clean-venv check as cicd-wheel-test.yml, but installing
      # icpp-candid from PyPI instead of a local wheel - so this also proves
      # the published dependency really resolves for an end user.
      - name: smoke test the wheel in a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install dist/icpp_pro-*.whl
          /tmp/clean/bin/icpp --version
          /tmp/clean/bin/python -c "
          from icpp import (
              commands_build_wasm,
              commands_build_native,
              commands_build_library,
              commands_build_library_native,
              commands_get,
              commands_init,
              commands_install_wasi_sdk,
              commands_install_rust,
          )
          print('all command modules imported cleanly')
          "

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # A separate job so the OIDC token is minted in a context that checks out no
  # code and runs no build steps - it only downloads the vetted artifact and
  # uploads it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: list distributions
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
