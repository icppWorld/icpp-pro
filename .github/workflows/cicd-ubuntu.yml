name: cicd-ubuntu

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "test/**"
      # scripts/ drives this very workflow (build/deploy/pytest
      # orchestration), so changes there must re-run the matrix
      - "scripts/**"
      - "Makefile"
      # a dependency pin change alters what actually gets built and installed,
      # so it must re-run the matrix (an arch-broken wheel from a pinned
      # dependency is exactly the kind of failure only this matrix sees)
      - "pyproject.toml"
      - ".github/trigger.txt"
      - ".github/workflows/cicd-ubuntu.yml"

# Cancel a superseded run - see the comment in cicd-mac.yml. `main` is
# excluded, because the release process needs each version commit's run to
# complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: the jobs only read the repository
permissions:
  contents: read

jobs:
  all-ubuntu:
    name: all-ubuntu
    strategy:
      # Don't cancel the whole matrix when one cell flakes — see comment
      # in cicd-mac.yml. Each cell stands or falls on its own.
      fail-fast: false
      matrix:
        # NOTE: Python versions MUST be quoted strings — YAML parses an
        # unquoted x.y0 (e.g. 3.10, 3.20) as a float, which would break
        # actions/setup-python. Keep the quotes even though the current
        # matrix has no such version.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    env:
      # The Python version that runs all-tests; the others run smoke-tests
      ALL_TESTS_PYTHON: "3.14"
      # `icp network start` downloads the icp-cli-network-launcher from the
      # GitHub API. Unauthenticated, that is 60 requests/hour shared across
      # ALL GitHub-hosted runners, so our matrix jobs randomly died with:
      #   403 rate limit exceeded for
      #   api.github.com/repos/dfinity/icp-cli-network-launcher/releases/latest
      # icp-cli reads this variable and authenticates with it (1000/hour for
      # this repo's token), for both the version lookup and the download.
      ICP_CLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # https://github.com/marketplace/actions/setup-miniconda
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          python-version: ${{ matrix.python-version }}
          # Python 3.14 (and often the newest 3.x line generally) is not
          # in conda's `defaults` channel for every (os, arch) combo —
          # conda-forge tracks new Python releases faster, so prefer it.
          # `channel-priority: strict` keeps the solver predictable.
          channels: conda-forge,defaults
          channel-priority: strict

      # -------------------------------------------------------------------
      # Checkout icpp-pro & icpp-candid as nested directory
      - name: checkout icpp-pro
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: checkout icpp-candid
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: icppWorld/icpp-candid
          path: icpp-candid
          fetch-depth: 0
      # -------------------------------------------------------------------

      - name: install
        shell: bash -l {0} # activates the default conda environment ('test')
        run: |
          echo "Installing tool chains & dependencies"
          pwd
          sudo apt-get update
          sudo apt-get install build-essential
          make summary
          make install-icp
          make install-python
          make install-clang-ubuntu
          make install-jp-ubuntu

      - name: versions
        shell: bash -l {0}
        run: |
          echo "icpp --version: $(icpp --version)"
          echo "clang++ --version: $(clang++ --version)"
          echo "g++ --version: $(g++ --version)"
          #echo "wasm2wat version: $(wasm2wat --version)"
          echo "pip version     : $(pip --version)"
          echo "python version  : $(python --version)"
          echo "jp version      : $(jp --version)"
          #echo "rustc version   : $(rustc --version)"
          echo "icp version    : $(icp --version)"
          echo "Ensure conda works properly"
          conda info
          which pip
          which python
          which icpp

      - name: install-wasi-sdk
        shell: bash -l {0}
        run: |
          echo "Installing wasi-sdk"
          icpp install-wasi-sdk

      - name: install-rust
        shell: bash -l {0}
        # Bump cargo's default network-retry from 3 to 10 to weather
        # transient DNS / index.crates.io hiccups on the runner.
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: |
          echo "Installing rust"
          icpp install-rust

      # The canister builds share one icpp-candid library folder (see
      # src/icpp/candid_library.py): built once per set of compile flags, then
      # reused. The wasm libraries are also kept between runs: the key is a hash
      # of every source and pin that goes into them, so when any of them changes
      # the folder starts empty and a stale library is never restored. Native
      # libraries (~400 MiB each, the system compiler) are shared within a run.
      - name: candid-library-folder
        id: candid-key
        run: |
          echo "ICPP_CANDID_LIBRARY_DIR=${{ runner.temp }}/candid-library" >> "$GITHUB_ENV"
          echo "key=candid-lib-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-${{ matrix.python-version == env.ALL_TESTS_PYTHON && 'all' || 'smoke' }}-${{ hashFiles('icpp-candid/src/icpp_candid/**', 'src/icpp/ic/**', 'src/icpp/version*.py', 'src/icpp/config_default.py', 'src/icpp/icpp_toml.py', 'src/icpp/candid_library.py', 'src/icpp/commands_build_library*.py') }}" >> "$GITHUB_OUTPUT"

      - name: restore-candid-library
        id: candid-library
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/candid-library/wasm32-wasi
          key: ${{ steps.candid-key.outputs.key }}

      # The C++ builds and the canister tests don't depend on the Python
      # version, so all-tests runs on one Python version per OS, and the other
      # versions run smoke-tests (static checks, python tests, greet). On
      # macOS this halves the wall-clock time: the free plan runs at most 5
      # macOS jobs at once. JOBS=3 deploys & tests 3 canisters at a time; each
      # gets its own local network, and they mostly wait on the replica.
      - name: all-tests
        if: matrix.python-version == env.ALL_TESTS_PYTHON
        shell: bash -l {0}
        run: |
          make all-tests JOBS=3

      - name: smoke-tests
        if: matrix.python-version != env.ALL_TESTS_PYTHON
        shell: bash -l {0}
        run: |
          make smoke-tests

      # Saved also when a test failed: the libraries it built are still valid
      - name: save-candid-library
        if: always() && steps.candid-library.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/candid-library/wasm32-wasi
          key: ${{ steps.candid-key.outputs.key }}
