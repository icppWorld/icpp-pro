name: cicd-mac

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "test/**"
      # scripts/ drives this very workflow (build/deploy/pytest
      # orchestration), so changes there must re-run the matrix
      - "scripts/**"
      - "Makefile"
      # a dependency pin change alters what actually gets built and installed,
      # so it must re-run the matrix (an arch-broken wheel from a pinned
      # dependency is exactly the kind of failure only this matrix sees)
      - "pyproject.toml"
      - ".github/trigger.txt"
      - ".github/workflows/cicd-mac.yml"

# A new push to the same branch makes the in-flight matrix irrelevant, and
# GitHub does not cancel it for us. That is not just waste: the macOS runner
# pool is small, so a superseded run keeps holding runners and the new one sits
# queued behind it. `main` is excluded, because the release process pushes a
# version commit there and needs that run to complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: the jobs only read the repository
permissions:
  contents: read

jobs:
  all-mac:
    name: all-mac
    strategy:
      # Don't cancel the whole matrix when one cell flakes (e.g. transient
      # DNS resolution failures hitting index.crates.io during install-rust
      # on macos-15-intel). Each (python-version, os) pair stands or falls
      # on its own and is rerun-able independently from the GitHub UI.
      fail-fast: false
      matrix:
        # NOTE: Python versions MUST be quoted strings — YAML parses an
        # unquoted x.y0 (e.g. 3.10, 3.20) as a float, which would break
        # actions/setup-python. Keep the quotes even though the current
        # matrix has no such version.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # macos-15-intel for Intel, macos-latest for Apple Silicon arm64
        os: [macos-15-intel, macos-latest]

    runs-on: ${{ matrix.os }}

    env:
      # The Python version that runs all-tests; the others run smoke-tests
      ALL_TESTS_PYTHON: "3.14"
      # `icp network start` downloads the icp-cli-network-launcher from the
      # GitHub API. Unauthenticated, that is 60 requests/hour shared across
      # ALL GitHub-hosted runners, so our matrix jobs randomly died with:
      #   403 rate limit exceeded for
      #   api.github.com/repos/dfinity/icp-cli-network-launcher/releases/latest
      # icp-cli reads this variable and authenticates with it (1000/hour for
      # this repo's token), for both the version lookup and the download.
      ICP_CLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # https://github.com/marketplace/actions/setup-miniconda
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          python-version: ${{ matrix.python-version }}
          # Python 3.14 (and often the newest 3.x line generally) is not
          # in conda's `defaults` channel for every (os, arch) combo —
          # macos-15-intel + python=3.14 in particular fails with
          # PackagesNotFoundError. conda-forge tracks new Python releases
          # faster, so prefer it. `channel-priority: strict` keeps the
          # solver predictable across versions.
          channels: conda-forge,defaults
          channel-priority: strict

      # -------------------------------------------------------------------
      # Checkout icpp-pro & icpp-candid as nested directory
      - name: checkout icpp-pro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: checkout icpp-candid
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: icppWorld/icpp-candid
          path: icpp-candid
          fetch-depth: 0
      # -------------------------------------------------------------------

      - name: install
        shell: bash -l {0} # activates the default conda environment ('test')
        run: |
          echo "Installing tool chains & dependencies"
          pwd
          make summary
          make install-icp
          make install-python
          make install-homebrew-mac
          make install-jp-mac

      - name: versions
        shell: bash -l {0}
        run: |
          echo "icpp --version: $(icpp --version)"
          echo "clang++ --version: $(clang++ --version)"
          echo "g++ --version: $(g++ --version)"
          #echo "wasm2wat version: $(wasm2wat --version)"
          echo "pip version     : $(pip --version)"
          echo "python version  : $(python --version)"
          echo "jp version      : $(jp --version)"
          #echo "rustc version   : $(rustc --version)"
          echo "icp version    : $(icp --version)"
          echo "Ensure conda works properly"
          conda info
          which pip
          which python
          which icpp

      - name: install-wasi-sdk
        shell: bash -l {0}
        run: |
          echo "Installing wasi-sdk"
          icpp install-wasi-sdk

      - name: install-rust
        shell: bash -l {0}
        # Cargo's default network retry is 3 attempts. macos-15-intel
        # runners have shown longer-than-3-attempt DNS resolution flakes
        # against index.crates.io. Bump retry count and request timeout
        # so transient hiccups don't take the cell down.
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: |
          echo "Installing rust"
          icpp install-rust

      # The canister builds share one icpp-candid library folder (see
      # src/icpp/candid_library.py): built once per set of compile flags, then
      # reused. The wasm libraries are also kept between runs: the key is a hash
      # of every source and pin that goes into them, so when any of them changes
      # the folder starts empty and a stale library is never restored. Native
      # libraries (~400 MiB each, the system compiler) are shared within a run.
      - name: candid-library-folder
        id: candid-key
        run: |
          echo "ICPP_CANDID_LIBRARY_DIR=${{ runner.temp }}/candid-library" >> "$GITHUB_ENV"
          echo "key=candid-lib-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-${{ matrix.python-version == env.ALL_TESTS_PYTHON && 'all' || 'smoke' }}-${{ hashFiles('icpp-candid/src/icpp_candid/**', 'src/icpp/ic/**', 'src/icpp/version*.py', 'src/icpp/config_default.py', 'src/icpp/icpp_toml.py', 'src/icpp/candid_library.py', 'src/icpp/commands_build_library*.py', 'src/icpp/canisters/**/icpp*.toml', 'test/canisters/**/icpp*.toml', '!**/__pycache__/**') }}" >> "$GITHUB_OUTPUT"

      - name: restore-candid-library
        id: candid-library
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/candid-library/wasm32-wasi
          key: ${{ steps.candid-key.outputs.key }}

      # The C++ builds and the canister tests don't depend on the Python
      # version, so all-tests runs on one Python version per OS, and the other
      # versions run smoke-tests (static checks, python tests, greet). On
      # macOS this halves the wall-clock time: the free plan runs at most 5
      # macOS jobs at once. JOBS deploys & tests that many canisters at a
      # time; each gets its own local network. The macOS runners are too slow
      # for 3 at a time: replica calls time out. macos-15-intel tests one
      # canister at a time, macos-latest two.
      - name: all-tests
        if: matrix.python-version == env.ALL_TESTS_PYTHON
        shell: bash -l {0}
        run: |
          make all-tests JOBS=${{ matrix.os == 'macos-15-intel' && 1 || 2 }}

      - name: smoke-tests
        if: matrix.python-version != env.ALL_TESTS_PYTHON
        shell: bash -l {0}
        run: |
          make smoke-tests

      # Saved also when a test failed: the libraries it built are still valid
      - name: save-candid-library
        if: always() && steps.candid-library.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/candid-library/wasm32-wasi
          key: ${{ steps.candid-key.outputs.key }}
